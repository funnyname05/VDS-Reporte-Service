spring.application.name=reporte-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:h2:file:./data/reportes_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=dbvalle
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=${JWT_SECRET:my-secret-key-that-should-be-very-long}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
# Al crear un reporte puede disparar una alerta
alert.service.url=${ALERT_SERVICE_URL:http://localhost:8084}

logging.level.org.springframework.security=DEBUG
spring.h2.console.settings.web-allow-others=true
